server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
      - id: user-service-route
        uri: http://localhost:8081
        predicates:
        - Path=/api/v1/users/**
        filters:
        - StripPrefix=0

      - id: catalog-service-route
        uri: http://localhost:8082
        predicates:
        - Path=/api/v1/catalog/**
        filters:
        - StripPrefix=0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/auction